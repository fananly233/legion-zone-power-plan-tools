name: PowerShell checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Windows PowerShell 5.1 isolated tests
        shell: powershell
        run: |
          ./tests/Run-Tests.ps1
          ./tests/Run-PatchTests.ps1
      - name: PowerShell 7 isolated tests
        shell: pwsh
        run: |
          ./tests/Run-Tests.ps1
          ./tests/Run-PatchTests.ps1
