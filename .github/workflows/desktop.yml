name: Desktop build and VM validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: PowerShell 5.1 tests
        shell: powershell
        run: |
          ./tests/Run-Tests.ps1
          ./tests/Run-PatchTests.ps1
          ./tests/Run-WindowsPlanTests.ps1
      - name: PowerShell 7 tests
        shell: pwsh
        run: |
          ./tests/Run-Tests.ps1
          ./tests/Run-PatchTests.ps1
          ./tests/Run-WindowsPlanTests.ps1
      - name: Desktop isolated tests
        shell: pwsh
        run: dotnet run --project tests/DesktopChecks/DesktopChecks.csproj -c Release
      - name: Disposable VM native power API validation
        shell: powershell
        run: ./tests/Invoke-VmValidation.ps1 -AllowVirtualMachineChanges
      - name: Administrator worker integration in CI VM
        shell: pwsh
        run: dotnet run --project tests/DesktopChecks/DesktopChecks.csproj -c Release -- --vm-worker
      - name: Publish portable app
        shell: pwsh
        run: ./scripts/Publish-Portable.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: LenovoPowerPlanTools-v0.3.0-win-x64
          path: |
            artifacts/*.zip
            artifacts/*.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vm-validation
          path: |
            artifacts/vm-validation/summary.json
            artifacts/vm-validation/*-parameters.txt
